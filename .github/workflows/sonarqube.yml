name: SonarQube Cloud
on:
  workflow_dispatch:
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=joan-biel-sonarsource
            -Dsonar.projectKey=joan-biel-sonarsource_creation-test-20261125-e2
            -Dsonar.projectName=creation-test-20261125-e2
